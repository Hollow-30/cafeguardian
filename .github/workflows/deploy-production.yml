name: Deploy to Vercel (production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production-${{ github.ref }}
  cancel-in-progress: false

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Vercel authentication
        shell: bash
        run: |
          npx vercel@latest whoami --token="$VERCEL_TOKEN"

      - name: Pull Vercel project settings and production environment
        shell: bash
        run: |
          ARGS=(--yes --environment=production --token="$VERCEL_TOKEN" --project="$VERCEL_PROJECT_ID")
          if [ -n "${VERCEL_ORG_ID:-}" ]; then
            ARGS+=(--scope="$VERCEL_ORG_ID")
          fi
          npx vercel@latest pull "${ARGS[@]}"

      - name: Build for production
        shell: bash
        run: |
          ARGS=(--prod --token="$VERCEL_TOKEN" --project="$VERCEL_PROJECT_ID")
          if [ -n "${VERCEL_ORG_ID:-}" ]; then
            ARGS+=(--scope="$VERCEL_ORG_ID")
          fi
          npx vercel@latest build "${ARGS[@]}"

      - name: Deploy production build
        shell: bash
        run: |
          ARGS=(--prebuilt --prod --yes --token="$VERCEL_TOKEN" --project="$VERCEL_PROJECT_ID")
          if [ -n "${VERCEL_ORG_ID:-}" ]; then
            ARGS+=(--scope="$VERCEL_ORG_ID")
          fi
          npx vercel@latest deploy "${ARGS[@]}"
